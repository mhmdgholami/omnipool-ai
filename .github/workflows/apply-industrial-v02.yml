name: apply-industrial-v02
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-industrial-v02.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified v0.2 source tree
        shell: bash
        run: |
          cat > /tmp/omnipool-v02.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/omnipool-v02.b64 > /tmp/omnipool-v02.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/omnipool-v02.tar.gz -C .
          rm -f .github/workflows/apply-industrial-v02.yml
          git config user.name "omnipool-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade OMNIPOOL to industrial v0.2 alpha"
          git push origin HEAD:main
