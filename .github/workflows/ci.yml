name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Python lint
        run: ruff check backend tests scripts

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Test
        run: pytest

      - name: Quant benchmark smoke check
        run: python scripts/benchmark.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          node --input-type=module --check < frontend/api.js
          node --input-type=module --check < frontend/app.js

      - name: Test browser request cancellation
        run: node --test tests/frontend_api.test.mjs
