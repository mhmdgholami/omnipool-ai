name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Python lint
        run: ruff check backend tests scripts

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Test
        run: pytest

      - name: Quant benchmark smoke check
        run: python scripts/benchmark.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          node --input-type=module --check < frontend/api.js
          node --input-type=module --check < frontend/app.js

      - name: Test browser request cancellation
        run: node --test tests/frontend_api.test.mjs


  container-smoke:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build production image
        run: docker build -t omnipool-ai:ci .

      - name: Create Railway-like data mount
        run: |
          mkdir -p .ci-data
          chmod 700 .ci-data

      - name: Start container with mounted data directory
        run: |
          docker run -d \
            --name omnipool-ci \
            -p 8000:8000 \
            -v "$PWD/.ci-data:/data" \
            -e DATABASE_PATH=/data/omnipool.db \
            -e SCAN_ON_STARTUP=false \
            -e AI_ENABLE_OLLAMA=false \
            -e AI_ENABLE_GROQ=false \
            -e AI_ENABLE_OPENROUTER=false \
            omnipool-ai:ci

      - name: Verify application dropped root privileges
        run: |
          for attempt in {1..20}; do
            if docker exec omnipool-ci \
              sh -c "grep -Eq '^Uid:[[:space:]]+10001' /proc/1/status"; then
              exit 0
            fi
            sleep 1
          done
          docker logs omnipool-ci
          exit 1

      - name: Verify health endpoint and SQLite persistence
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              docker exec omnipool-ci test -f /data/omnipool.db
              test "$(docker exec omnipool-ci stat -c '%u' /data/omnipool.db)" = "10001"
              exit 0
            fi
            sleep 1
          done
          docker logs omnipool-ci
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker rm -f omnipool-ci || true
          sudo rm -rf .ci-data
